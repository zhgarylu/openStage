name: Refresh project data
on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: openstage-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect snapshot
        run: python -m scripts.snapshot
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
      - name: Create weekly draft when data is ready
        if: github.event_name == 'schedule' && github.event.schedule == '30 22 * * *'
        run: |
          if [ "$(TZ=Asia/Shanghai date +%u)" = 1 ]; then
            python -m scripts.rank || { code=$?; if [ "$code" -ne 2 ]; then exit "$code"; fi; echo 'No complete seven-day draft available yet.'; }
          fi
      - run: python -m scripts.build_data
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci && npm run build
        working-directory: site
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - name: Commit validated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data site/src/data
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh project data'
            git push
          fi
